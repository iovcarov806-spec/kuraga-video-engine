[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kuraga-video-engine"
version = "0.1.0"
description = "Batch vertical-video generator for the «Kuraga Lore» series: episodes + microloops"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "moviepy>=2.0,<3",
    "edge-tts>=7.0",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "numpy>=1.26",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
kuraga-video = "kuraga_video_engine.cli:main"

[tool.setuptools]
packages = ["kuraga_video_engine"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
